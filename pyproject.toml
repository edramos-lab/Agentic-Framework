[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-orchestra"
version = "0.1.0"
description = "Multi-agent framework for automated research paper writing with integrated experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Edgar René Ramos Acosta", email = "edgar.rene.ramos.acosta@uabc.edu.mx"},
]

dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
    "semanticscholar>=0.8.0",
    "matplotlib>=3.8.0",
    "bibtexparser>=1.4.0",
    "Jinja2>=3.1.0",
    "google-colab-cli>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0", "mypy>=1.10"]

[project.scripts]
paper-orchestra = "paper_orchestra.cli:main"

[tool.setuptools.packages.find]
include = ["paper_orchestra*"]

[tool.ruff]
target-version = "py310"
line-length = 100
